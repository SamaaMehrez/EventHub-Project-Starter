apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: catalog
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: catalog
spec:
  source:
    type: Git
    git:
      uri: https://github.com/SamaaMehrez/EventHub-Project-Starter.git
      ref: main
    contextDir: services/legacy-catalog-java
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: catalog:latest
  triggers:
    - type: ConfigChange

